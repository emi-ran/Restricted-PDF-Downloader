<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Restricted PDF Downloader</title>
    <style>
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --secondary: #8b5cf6;
        --secondary-dark: #7c3aed;
        --success: #10b981;
        --success-dark: #059669;
        --bg: #ffffff;
        --text: #1e293b;
        --text-light: #64748b;
        --border: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 280px;
        padding: 20px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .header {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
      }

      .header-icon {
        font-size: 24px;
      }

      h3 {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .btn {
        width: 100%;
        padding: 14px;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        margin-bottom: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .btn:last-of-type {
        margin-bottom: 0;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
      }

      .btn-secondary {
        background: linear-gradient(
          135deg,
          var(--secondary),
          var(--secondary-dark)
        );
      }

      .btn-success {
        background: linear-gradient(
          135deg,
          var(--success),
          var(--success-dark)
        );
      }

      .badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
      }

      .footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-light);
        font-size: 11px;
      }

      .github-link {
        color: var(--text-light);
        transition: color 0.2s ease;
        display: flex;
        align-items: center;
      }

      .github-link:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-icon">📑</div>
      <h3>Restricted PDF Downloader</h3>
    </div>

    <button id="convertButton" class="btn btn-primary">
      <span>Bu Sayfayı İndir</span>
    </button>

    <button id="batchButton" class="btn btn-secondary" style="display: none">
      <span>Toplu İndir</span>
      <span class="badge" id="tabCount">0</span>
    </button>

    <button id="classroomButton" class="btn btn-success" style="display: none">
      <span>Tüm Materyalleri Aç</span>
      <span class="badge" id="materialCount">0</span>
    </button>

    <div class="footer">
      <span>v1.5</span>
      <a
        href="https://github.com/emi-ran/Restricted-PDF-Downloader"
        target="_blank"
        class="github-link"
        title="GitHub"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
          />
        </svg>
      </a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Toplu PDF İndirme</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      h3 {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
        font-size: 15px;
        flex-shrink: 0;
      }
      .warning {
        background: #fff3cd;
        color: #856404;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 10px;
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
        flex-shrink: 0;
      }
      .status-box {
        background: #f0f4ff;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 10px;
        flex-shrink: 0;
      }
      #statusText {
        font-size: 12px;
        color: #555;
        margin-bottom: 6px;
        word-break: break-word;
      }
      .progress-bar {
        width: 100%;
        height: 6px;
        background: #e0e0e0;
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #4caf50, #81c784);
        border-radius: 3px;
        transition: width 0.3s ease;
        width: 0%;
      }
      .speed-container {
        margin-bottom: 10px;
        flex-shrink: 0;
      }
      .speed-label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #555;
        font-size: 11px;
        text-align: center;
      }
      .speed-options {
        display: flex;
        gap: 5px;
      }
      .speed-box {
        flex: 1;
        padding: 7px 3px;
        border: 2px solid #e0e0e0;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 11px;
        font-weight: 500;
        background: #fafafa;
        text-align: center;
      }
      .speed-box:hover {
        background-color: #f0f0f0;
        border-color: #bbb;
      }
      .speed-box.selected {
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        color: white;
        border-color: #4caf50;
      }
      .btn {
        width: 100%;
        padding: 11px;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s ease;
        background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
        flex-shrink: 0;
        margin-top: auto;
      }
      .btn:hover:not(:disabled) {
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-success {
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      }
    </style>
  </head>
  <body>
    <h3>📦 Toplu PDF İndirme</h3>

    <div class="warning">
      ⚠️ İşlem sırasında bu pencereyi kapatmayın ve sekmelere tıklamayın!
    </div>

    <div class="status-box">
      <div id="statusText">Hazır. Başlatmak için butona tıklayın.</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="speed-container">
      <span class="speed-label">Kaydırma Hızı</span>
      <div class="speed-options">
        <div class="speed-box" data-speed="800">Yavaş</div>
        <div class="speed-box selected" data-speed="400">Orta</div>
        <div class="speed-box" data-speed="200">Hızlı</div>
      </div>
    </div>

    <button id="startBtn" class="btn">
      🚀 Başlat (<span id="tabCount">0</span> PDF)
    </button>

    <script src="assets/jszip.min.js"></script>
    <script src="assets/jspdf.umd.min.js"></script>
    <script src="batch.js"></script>
  </body>
</html>

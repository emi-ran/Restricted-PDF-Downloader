name: CI ve sürüm

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Eklentiyi doğrula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript sözdizimini kontrol et
        run: |
          node --check background.js
          node --check batch.js
          node --check popup.js
      - name: Manifest ve paket dosyalarını kontrol et
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (manifest.manifest_version !== 3 || !/^\d+(\.\d+){1,3}$/.test(manifest.version)) throw new Error("Geçersiz manifest sürümü");
            for (const file of ["popup.html", "popup.js", "batch.html", "batch.js", "background.js", "assets/jszip.min.js", "assets/jspdf.umd.min.js", "assets/ico.png"]) {
              if (!fs.existsSync(file)) throw new Error(`Eksik dosya: ${file}`);
            }
          '
      - name: Etiket ve manifest sürümünü karşılaştır
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const {version} = require("./manifest.json");
            if (process.env.TAG !== `v${version}`) throw new Error(`Etiket v${version} olmalı: ${process.env.TAG}`);
          '

  release:
    name: Sürüm yayınla
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Eklenti ZIP paketini hazırla
        run: zip -r restricted-pdf-downloader.zip manifest.json background.js popup.html popup.js batch.html batch.js assets
      - name: Yayın oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" restricted-pdf-downloader.zip --verify-tag --title "$TAG" --generate-notes
